[package]
name = "omarchywispr"
version = "0.1.0"
edition = "2021"
description = "Local push-to-talk dictation for Omarchy (whisper.cpp, CUDA)"
license = "MIT"

[dependencies]
whisper-rs = { version = "0.16", features = ["cuda", "log_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
